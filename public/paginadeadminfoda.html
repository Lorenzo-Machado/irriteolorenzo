<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>admin</title>
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(120deg, #f6d7e0, #f7f7a0, #d0f0c0, #a2c2e8);
        background-size: 600% 600%;
        animation: gradientShift 15s ease infinite;
    }
    .container {
        text-align: center;
        background: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        max-width: 600px;
        width: 100%;
    }
    #messageList {
        overflow-y: auto;
        height: 400px;
        display: flex;
        flex-direction: column;
    }
    #messageList li {
        background: #ffffff;
        margin-bottom: 20px;
        padding: 15px;
        border-radius: 10px;
        border: 1px solid #ddd;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .message-text {
        font-size: 14px;
        color: #333;
        margin-bottom: 10px;
        text-align: left;
        word-break: break-all;
    }
    .message-actions {
        display: flex;
        justify-content: flex-end;
    }
    .pw-input {
      margin-bottom: 10px;
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 3px;
    }
    button {
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
        margin-left: 10px;
    }
    .ban-button { background-color: #e74c3c; }
    .ban-button:hover { background-color: #c0392b; }
    .unban-button { background-color: #2ecc71; }
    .unban-button:hover { background-color: #27ae60; }
    @keyframes gradientShift {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 0% 0%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>admin</h1>
    <input type="password" id="pw" class="pw-input" placeholder="senha">
    <ul id="messageList"></ul>
  </div>
  <script>
    let lastPlayedMessage = null;
    let audioQueue = [];
    let isPlaying = false;
  
    function fetchMessages() {
      fetch('/messages')
        .then(r => r.json())
        .then(data => {
          const list = document.getElementById('messageList');
          list.innerHTML = '';
          data.forEach(msg => {
            const li = document.createElement('li');
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            textDiv.textContent = msg.timestamp + ' - ' + msg.ip + ' - ' + msg.text;
            li.appendChild(textDiv);
            const actions = document.createElement('div');
            actions.className = 'message-actions';
            const banBtn = document.createElement('button');
            banBtn.className = 'ban-button';
            banBtn.textContent = 'Banir';
            banBtn.onclick = () => banIp(msg.ip);
            const unbanBtn = document.createElement('button');
            unbanBtn.className = 'unban-button';
            unbanBtn.textContent = 'Desbanir';
            unbanBtn.onclick = () => unbanIp(msg.ip);
            actions.appendChild(banBtn);
            actions.appendChild(unbanBtn);
            li.appendChild(actions);
            list.appendChild(li);
          });
          list.scrollTop = list.scrollHeight;
          const newMsgs = data.slice(-1);
          newMsgs.forEach(msg => {
            if (msg.fileName && msg.fileName !== lastPlayedMessage) {
              audioQueue.push(msg.fileName);
              lastPlayedMessage = msg.fileName;
            }
          });
          if (!isPlaying && audioQueue.length > 0) playNextAudio();
        })
        .catch(e => console.error(e));
    }

    function playNextAudio() {
      if (audioQueue.length === 0) return;
      isPlaying = true;
      const name = audioQueue.shift();
      const audio = new Audio('/' + name);
      audio.oncanplaythrough = () => audio.play().catch(() => {});
      audio.onended = () => {
        isPlaying = false;
        playNextAudio();
      };
    }
  
    function getPw() { return document.getElementById('pw').value || 'irriteoadmin'; }

    function banIp(ip) {
      fetch('/ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ip, password: getPw() })
      }).then(r => r.text()).then(d => { alert(d); fetchMessages(); });
    }
  
    function unbanIp(ip) {
      fetch('/unban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ip, password: getPw() })
      }).then(r => r.text()).then(d => { alert(d); fetchMessages(); });
    }
  
    setInterval(fetchMessages, 3000);
  </script>
</body>
</html>
