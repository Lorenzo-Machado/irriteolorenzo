<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>irrite o lorenzo</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(120deg, #f6d7e0, #f7f7a0, #d0f0c0, #a2c2e8);
      background-size: 600% 600%;
      animation: gradientShift 15s ease infinite;
    }
    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }
    textarea {
      width: 300px;
      height: 100px;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      font-family: inherit;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: linear-gradient(120deg, #f7a, #f77, #f7a);
      color: white;
      font-size: 16px;
      cursor: pointer;
      animation: rgbGlow 3s linear infinite;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      animation: none;
      box-shadow: none;
    }
    .confirmation {
      margin-top: 10px;
      font-size: 16px;
      color: green;
      min-height: 20px;
    }
    @keyframes rgbGlow {
      0% { box-shadow: 0 0 5px #f7a, 0 0 10px #f7a; }
      50% { box-shadow: 0 0 5px #f77, 0 0 10px #f77; }
      100% { box-shadow: 0 0 5px #f7a, 0 0 10px #f7a; }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Oque voce digitar aqui tocara em um speaker no meu quarto</h1>
    <form id="messageForm">
      <textarea id="message" placeholder="digite sua mensagem aqui" maxlength="500"></textarea>
      <button type="submit" id="submitBtn">me irritar</button>
      <div class="confirmation" id="confirmation"></div>
    </form>
  </div>
  <script>
    document.getElementById('messageForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const message = document.getElementById('message').value;
      const btn = document.getElementById('submitBtn');
      const conf = document.getElementById('confirmation');

      if (!message.trim()) return;

      btn.disabled = true;
      conf.textContent = 'mensagem enviada';

      fetch('/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: message })
      })
      .then(r => {
        if (r.status === 403) window.location.href = '/banned.html';
        else if (r.status === 429) conf.textContent = 'calma, espera 5s';
        else return r.text();
      })
      .then(() => {
        setTimeout(() => {
          btn.disabled = false;
          setTimeout(() => conf.textContent = '', 2000);
        }, 3000);
      })
      .catch(() => {
        btn.disabled = false;
        conf.textContent = '';
      });

      document.getElementById('message').value = '';
    });
  </script>
</body>
</html>
